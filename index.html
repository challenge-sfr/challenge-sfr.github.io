<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Challenge OUEST 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Mise en page : une colonne mobile, grille du mois en 7 colonnes (lun→dim) de paquets cadeaux, détail du jour en panneau bas */
:root{
  --bg:#f7f3f2; --surface:#ffffff; --ink:#22161a; --muted:#6f5f63;
  --red:#e2001a; --gold:#b8861f; --blue:#1d5fd6; --line:#e7dcdc; --off:#efe8e8; --off-ink:#a39598;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170e10; --surface:#22171a; --ink:#f5ecec; --muted:#b8a7aa;
  --red:#ff3348; --gold:#e3b257; --blue:#6aa3ff; --line:#3a2a2e; --off:#221719; --off-ink:#6f5e62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170e10; --surface:#22171a; --ink:#f5ecec; --muted:#b8a7aa;
  --red:#ff3348; --gold:#e3b257; --blue:#6aa3ff; --line:#3a2a2e; --off:#221719; --off-ink:#6f5e62; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}

header{background:linear-gradient(160deg,#ff2a3d,#c4001a 70%);color:#fff;border-radius:18px;padding:22px 18px 20px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(160,0,20,.25)}
header::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0 1.5px,transparent 2px) 0 0/22px 22px,
             radial-gradient(circle,rgba(255,255,255,.3) 0 1px,transparent 1.5px) 11px 9px/22px 22px;
  -webkit-mask:linear-gradient(90deg,transparent 30%,#000);mask:linear-gradient(90deg,transparent 30%,#000)}
h1{font-family:var(--f-display);font-weight:900;font-size:48px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;position:relative}
.sub{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;opacity:.92;position:relative}

.cal{display:flex;flex-direction:column;gap:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.grid{row-gap:18px;padding-top:8px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.blank{aspect-ratio:3/4}

/* ---------- Paquets cadeaux ---------- */
.day{appearance:none;border:0;font:inherit;cursor:pointer;aspect-ratio:3/4;max-width:100%;border-radius:8px;
  position:relative;overflow:visible;font-variant-numeric:tabular-nums;transition:transform .15s;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.day:active{transform:scale(.94)}
.day:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- Boules de sapin ---------- */
.day.orn{background:none}
.day.orn svg{width:100%;height:100%;overflow:visible;display:block}
.day.orn .num{font-family:var(--f-display);font-weight:900;font-size:15px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}

.day.today{animation:bob 1.8s ease-in-out infinite}
.day.today{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}

/* dimanches : grisés */
.day.none{background:var(--off);color:var(--off-ink);cursor:default;border-radius:8px;box-shadow:none;justify-content:center;padding-bottom:0;gap:2px}
.day.none .n{position:static;text-shadow:none;color:inherit;font-size:clamp(15px,4.4vw,21px)}
.day.none .t{font-size:10px;font-weight:700}

/* 25 décembre : sapin */
.day.tree{background:transparent;cursor:default;box-shadow:none;justify-content:center;padding:0}
.day.tree svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,40,10,.3))}

@media (prefers-reduced-motion:reduce){.day.today{animation:none}.day{transition:none}}

/* défi et gagnants dans le panneau */
.defi{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.defi .k,.winners .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.winners{margin-top:12px;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.winners .row{display:flex;justify-content:space-between;gap:10px}
.winners .row span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere;min-width:0;white-space:pre-wrap}
.orn .won{position:absolute;right:0;bottom:0;width:16px;height:16px}

.foot{font-size:12px;color:var(--muted);text-align:center}
.sim{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.sim .lab{font-size:13px;color:var(--muted);text-align:center;min-width:0}
.sim .lab b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);text-transform:uppercase}
.sim button{border:0;border-radius:10px;width:44px;height:44px;flex:none;font:inherit;font-size:20px;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.sim button:disabled{opacity:.35;cursor:default}
.sim button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* panneau détail */
.scrim{position:fixed;inset:0;background:rgba(20,8,10,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding-top:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .d{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;margin:6px 0 14px;text-transform:uppercase}
.prizes{display:flex;flex-direction:column;gap:8px}
.prize{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prize .who{font-weight:600}
.prize .amt{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.05;color:var(--red);text-align:right;overflow-wrap:anywhere;min-width:0}
.prize.s .amt{color:var(--gold)}
.sheet p{color:var(--muted);margin:12px 0 0}
.close{margin-top:18px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.close:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.lockmsg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0}
.lockmsg svg{width:44px;height:44px;color:var(--red)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Challenge OUEST 1</h1>
    <div class="sub">Décembre 2026</div>
  </header>

  <div class="sim" id="sim" hidden>
    <button type="button" id="simPrev" aria-label="Jour précédent">‹</button>
    <div class="lab">Simulation<b id="simDay"></b></div>
    <button type="button" id="simNext" aria-label="Jour suivant">›</button>
  </div>

  <section class="cal" aria-label="Calendrier de décembre 2026">
    <div class="dow" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<linearGradient id="pCap" x1="0" x2="1"><stop offset="0" stop-color="#8a5a06"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".6" stop-color="#d9a42a"/><stop offset="1" stop-color="#7a4e04"/></linearGradient>

<symbol id="sIce" viewBox="0 0 60 82"><circle cx="30" cy="48" r="22" fill="url(#pIce)"/><g clip-path="url(#pBall)" fill="#fff"><circle cx="14" cy="56" r=".9" opacity=".8"/><circle cx="19" cy="62" r=".7" opacity=".7"/><circle cx="40" cy="60" r="1" opacity=".8"/><circle cx="45" cy="52" r=".7" opacity=".7"/><path d="M8 58Q30 70 52 58V72H8Z" opacity=".35"/></g><g stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".95"><path d="M30 34V52M22.2 38.5L37.8 47.5M22.2 47.5L37.8 38.5"/><path d="M27.5 36.5L30 39L32.5 36.5M27.5 49.5L30 47L32.5 49.5"/></g><circle cx="30" cy="48" r="21.4" fill="none" stroke="#fff" stroke-opacity=".6"/><circle cx="30" cy="48" r="22" fill="url(#pEdge)" opacity=".7"/><ellipse cx="21" cy="36" rx="7" ry="3.5" fill="#fff" opacity=".7" transform="rotate(-35 21 36)"/></symbol>
<symbol id="sMirR" viewBox="0 0 60 82"><circle cx="30" cy="48" r="22" fill="url(#pRed)"/><path d="M10 54Q30 46 50 54" stroke="#4a0008" stroke-width="5" fill="none" opacity=".35" clip-path="url(#pBall)"/><path d="M14 63A19 19 0 0 0 44 66" stroke="#ff8a96" stroke-width="2" fill="none" opacity=".6"/><circle cx="30" cy="48" r="22" fill="url(#pEdge)"/><ellipse cx="21" cy="37" rx="8" ry="4" fill="#fff" opacity=".55" transform="rotate(-35 21 37)"/><circle cx="18.5" cy="35" r="2.2" fill="#fff"/></symbol>

<symbol id="sGliG" viewBox="0 0 60 82"><circle cx="30" cy="48" r="22" fill="url(#pGold)"/><g clip-path="url(#pBall)"><g fill="#fff"><circle cx="16" cy="44" r=".9"/><circle cx="22" cy="52" r=".6"/><circle cx="27" cy="40" r=".7"/><circle cx="34" cy="55" r="1"/><circle cx="41" cy="45" r=".7"/><circle cx="45" cy="57" r=".9"/><circle cx="20" cy="62" r=".7"/><circle cx="38" cy="36" r=".8"/><circle cx="12" cy="52" r=".6"/><circle cx="48" cy="48" r=".6"/></g><g fill="#7a4e04" opacity=".55"><circle cx="19" cy="48" r=".8"/><circle cx="31" cy="50" r=".7"/><circle cx="43" cy="51" r=".8"/><circle cx="37" cy="61" r=".8"/><circle cx="14" cy="58" r=".6"/></g><path d="M8 43H52" stroke="#e2001a" stroke-width="3"/></g><circle cx="30" cy="48" r="22" fill="url(#pEdge)" opacity=".8"/><ellipse cx="21" cy="37" rx="6" ry="3" fill="#fff" opacity=".6" transform="rotate(-35 21 37)"/></symbol>

<div class="scrim" id="scrim" hidden></div>

<script>
(function(){
  var DOWS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  function dowOf(d){return (2+(d-1))%7;} // 1er décembre 2026 = mardi ; 0 = dimanche
  function gain(d){
    var w=dowOf(d);
    if(d===25) return {type:"none"};
    if(w===0) return {type:"none"};
    return {type:w===6?"sat":"week"};
  }
  function parisToday(){
    var p=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var o={};p.forEach(function(x){o[x.type]=+x.value;});return o;
  }
  var preview=location.hash==="#apercu";
  var simM=/^#jour-(\d{1,2})$/.exec(location.hash), sim=simM?Math.min(31,Math.max(1,+simM[1])):0;
  var t=parisToday();
  var openUpTo, todayDay=0;
  if(sim){openUpTo=sim;todayDay=sim;}
  else if(preview) openUpTo=31;
  else if(t.year<2026||(t.year===2026&&t.month<12)) openUpTo=0;
  else if(t.year===2026&&t.month===12){openUpTo=t.day;todayDay=t.day;}
  else openUpTo=31;

  var TREE='<svg viewBox="0 0 60 80" aria-hidden="true">'+
    '<path d="M30 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L21 10l6-1z" fill="#ffd34d" stroke="#c8951f" stroke-width="1"/>'+
    '<path d="M30 16L44 34H37L50 52H41L55 68H5L19 52H10L23 34H16Z" fill="#1f8a3a"/>'+
    '<path d="M30 16L44 34H37L50 52H41L55 68H30Z" fill="#146b2b"/>'+
    '<path d="M18 40q12 5 25-1M14 58q16 6 33-1" stroke="#ffd34d" stroke-width="1.6" fill="none"/>'+
    '<rect x="26" y="68" width="8" height="8" rx="1" fill="#7a4a22"/>'+
    '<circle cx="26" cy="30" r="2.4" fill="#e2001a"/><circle cx="36" cy="44" r="2.4" fill="#4aa3ff"/>'+
    '<circle cx="22" cy="48" r="2.4" fill="#ffd34d"/><circle cx="40" cy="61" r="2.6" fill="#e2001a"/>'+
    '<circle cx="19" cy="63" r="2.4" fill="#4aa3ff"/><circle cx="31" cy="56" r="2.2" fill="#fff"/>'+
    '</svg>';
  /* Boules de sapin : 6 variantes réparties au hasard, mais toujours de la même façon pour tout le monde */
  var STYLES={
    ice: {sym:"sIce", cap:"pCapS",str:"#9aa6b2",inside:"#24527d",star:"#fff",   starS:"#8fc3e8",num:"#1d3f63",numS:"rgba(255,255,255,.7)",spark:"#fff"},
    mirR:{sym:"sMirR",cap:"pCap", str:"#c8901a",inside:"#2a0005",star:"#ffd34d",starS:"#c8901a",num:"#fff",   numS:"rgba(0,0,0,.4)"},
    mirG:{sym:"sMirG",cap:"pCap", str:"#c8901a",inside:"#4a2e00",star:"#ffd34d",starS:"#c8901a",num:"#6b1000",numS:"rgba(255,255,255,.6)"},
    gliG:{sym:"sGliG",cap:"pCap", str:"#c8901a",inside:"#4a2e00",star:"#fff6c4",starS:"#c8901a",num:"#6b1000",numS:"rgba(255,255,255,.6)",spark:"#ffd34d"},
    gliR:{sym:"sGliR",cap:"pCap", str:"#c8901a",inside:"#2a0005",star:"#ffd34d",starS:"#c8901a",num:"#fff",   numS:"rgba(0,0,0,.4)",spark:"#ffd34d"},
    cry: {sym:"sCry", cap:"pCapS",str:"#9aa6b2",inside:"#2a0005",star:"#fff",   starS:"#ffb3ba",num:"#fff",   numS:"rgba(0,0,0,.4)"}
  };
  var STYLE_FOR={};
  (function(){
    var keys=Object.keys(STYLES), seed=20261201, prev="";
    function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}
    for(var d=1;d<=31;d++){var k;do{k=keys[Math.floor(rnd()*keys.length)];}while(k===prev);STYLE_FOR[d]=k;prev=k;}
  })();
  var STAR5='M30 30l3 6.2 6.8.8-5 4.6 1.3 6.7L30 45l-6.1 3.3 1.3-6.7-5-4.6 6.8-.8z';
  function sparkle(x,y,r,c){return '<path d="M'+x+' '+(y-r)+'l'+(r*.3)+' '+(r*.7)+' '+(r*.7)+' '+(r*.3)+'-'+(r*.7)+' '+(r*.3)+'-'+(r*.3)+' '+(r*.7)+'-'+(r*.3)+'-'+(r*.7)+'-'+(r*.7)+'-'+(r*.3)+' '+(r*.7)+'-'+(r*.3)+'z" fill="'+c+'"/>';}
  function ornament(open,d){
    var st=STYLES[STYLE_FOR[d]];
    var shadow='<ellipse cx="32" cy="77" rx="15" ry="2.6" fill="#000" opacity=".18"/>';
    var num='<text class="num" x="30" y="67" text-anchor="middle" style="fill:'+st.num+';stroke:'+st.numS+'">'+d+'</text>';
    var cap='<rect x="25" y="18" width="10" height="8" rx="1.5" fill="url(#'+st.cap+')"/>';
    if(!open){
      return '<svg viewBox="0 0 60 82" aria-hidden="true">'+shadow+
        '<path d="M30 0V19" stroke="'+st.str+'" stroke-width="1.2"/>'+cap+
        '<use href="#'+st.sym+'"/>'+
        (st.spark?sparkle(49,28,4,st.spark)+sparkle(10,66,2.6,st.spark):'')+num+'</svg>';
    }
    return '<svg viewBox="0 0 60 82" aria-hidden="true">'+shadow+
      '<circle cx="30" cy="40" r="21" fill="url(#pGlow)"/>'+
      sparkle(12,28,3,"#ffd34d")+sparkle(50,22,3,"#ffd34d")+'<circle cx="46" cy="38" r="1.2" fill="#ffd34d"/>'+
      '<path d="'+STAR5+'" fill="'+st.star+'" stroke="'+st.starS+'"/>'+
      '<g clip-path="url(#pBot)"><use href="#'+st.sym+'"/></g>'+
      '<ellipse cx="30" cy="50" rx="22" ry="3" fill="'+st.inside+'"/>'+
      '<g transform="translate(-4 -14) rotate(-18 30 44)"><g clip-path="url(#pTop)"><use href="#'+st.sym+'"/></g>'+
        '<ellipse cx="30" cy="46" rx="22" ry="2.6" fill="'+st.inside+'"/>'+cap+'</g>'+
      '<path d="M30 0Q26 1 18 5" stroke="'+st.str+'" stroke-width="1.2" fill="none"/>'+num+'</svg>';
  }
  var grid=document.getElementById("grid");
  var lead=(dowOf(1)+6)%7; // lundi = 0
  for(var i=0;i<lead;i++){var b=document.createElement("div");b.className="blank";grid.appendChild(b);}
  for(var d=1;d<=31;d++){
    if(dowOf(d)===0) continue; // pas de colonne dimanche
    var g=gain(d), el=document.createElement("button");
    el.type="button";el.id="day-"+d;
    var isOpen=d<=openUpTo;
    if(d===25){
      el.className="day tree";
      el.innerHTML=TREE;
      el.setAttribute("aria-label","vendredi 25 décembre, Noël, pas de case");
      el.setAttribute("aria-disabled","true");
    } else {
      el.className="day orn "+STYLE_FOR[d]+(isOpen?" open":"")+(d===todayDay?" today":"");
      el.innerHTML=ornament(isOpen,d);
      el.setAttribute("aria-label",DOWS[dowOf(d)]+" "+d+" décembre"+(isOpen?", ouverte":", fermée"));
    }
    (function(day){el.addEventListener("click",function(){openSheet(day);});})(d);
    grid.appendChild(el);
  }

  var sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"), lastBtn=null;
  function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pad(d){return (d<10?"0":"")+d;}
  function info(d){return DATA["d"+pad(d)]||{};}
  function filled(v){return !!(v||"").trim();}
  function hasWinner(d){var x=info(d);return filled(x.magasin)||filled(x.vendeur);}
  function showSheet(html,focusId){
    sheet.innerHTML=html; sheet.hidden=false; scrim.hidden=false;
    var c=document.getElementById(focusId||"closeBtn"); if(c) c.focus();
    var cb=document.getElementById("closeBtn"); if(cb) cb.addEventListener("click",closeSheet);
  }
  function openSheet(d){
    var g=gain(d); if(g.type==="none")return;
    lastBtn=document.getElementById("day-"+d);
    var head='<div class="d">'+DOWS[dowOf(d)]+' '+d+' décembre 2026</div>';
    var body, x=info(d);
    if(d>openUpTo){
      body='<div class="big" id="sheetTitle">Case '+d+'</div><div class="lockmsg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><strong>Pas encore !</strong><span style="color:var(--muted)">Ce cadeau s\'ouvre le '+d+' décembre.</span></div>';
    } else {
      var prizes=[];
      if(filled(x.gainMagasin)) prizes.push(["Magasin",x.gainMagasin]);
      if(filled(x.gainVendeur)) prizes.push(["Vendeur",x.gainVendeur]);
      body='<div class="big" id="sheetTitle">Case '+d+'</div>'+
        (filled(x.challenge)?'<div class="defi"><span class="k">Challenge du jour</span>'+esc(x.challenge)+'</div>':'')+
        (prizes.length?'<div class="prizes">'+prizes.map(function(p){return '<div class="prize"><span class="who">'+p[0]+'</span><span class="amt">'+esc(p[1])+'</span></div>';}).join("")+'</div>':'');
      if(hasWinner(d)){
        var rows=[];
        if(filled(x.magasin)) rows.push(["Magasin",x.magasin]);
        if(filled(x.vendeur)) rows.push(["Vendeur",x.vendeur]);
        body+='<div class="winners"><span class="k">Gagnants</span>'+rows.map(function(r){return '<div class="row"><span>'+r[0]+'</span><span>'+esc(r[1])+'</span></div>';}).join("")+'</div>';
      }
      if(!filled(x.challenge)&&!prizes.length&&!hasWinner(d)) body+='<p>Les détails de ce jour arrivent bientôt.</p>';
    }
    showSheet(head+body+'<button class="close" id="closeBtn" type="button">Fermer</button>');
  }
  function closeSheet(){sheet.hidden=true;scrim.hidden=true;if(lastBtn&&document.contains(lastBtn))lastBtn.focus();}
  scrim.addEventListener("click",closeSheet);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet();});
  window.addEventListener("hashchange",function(){location.reload();});

  /* ---------- Données publiées (data.json) ---------- */
  var DATA={};
  var STAR='<svg class="won" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#ffd34d" stroke="#9a6404" stroke-width="1.5"/></svg>';
  function markWinners(){
    for(var d=1;d<=31;d++){
      var el=document.getElementById("day-"+d); if(!el||el.className.indexOf("orn")<0) continue;
      var old=el.querySelector(".won"); if(old) old.remove();
      if(d<=openUpTo&&hasWinner(d)) el.insertAdjacentHTML("beforeend",STAR);
    }
  }
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{};})
    .then(function(j){DATA=(j&&j.jours)||{};markWinners();}).catch(function(){});

  if(sim){
    document.getElementById("sim").hidden=false;
    document.getElementById("simDay").textContent=DOWS[dowOf(sim)]+" "+sim+" déc.";
    var pv=document.getElementById("simPrev"), nx=document.getElementById("simNext");
    pv.disabled=sim<=1; nx.disabled=sim>=31;
    pv.addEventListener("click",function(){location.hash="jour-"+(sim-1);});
    nx.addEventListener("click",function(){location.hash="jour-"+(sim+1);});
  }
  var foot=document.getElementById("foot");
  if(sim) foot.textContent="Mode simulation actif. Retirez #jour-"+sim+" de l'adresse pour revenir au mode normal.";
  else if(preview) foot.textContent="Mode aperçu actif. Retirez #apercu de l'adresse pour revenir au mode normal.";
  else foot.hidden=true;
})();
</script>
</body>
</html>
