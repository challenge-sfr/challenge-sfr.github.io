<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Challenge OUEST 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Mise en page : une colonne mobile, grille du mois en 7 colonnes (lun→dim) de paquets cadeaux, détail du jour en panneau bas */
:root{
  --bg:#f7f3f2; --surface:#ffffff; --ink:#22161a; --muted:#6f5f63;
  --red:#e2001a; --gold:#b8861f; --blue:#1d5fd6; --line:#e7dcdc; --off:#efe8e8; --off-ink:#a39598;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170e10; --surface:#22171a; --ink:#f5ecec; --muted:#b8a7aa;
  --red:#ff3348; --gold:#e3b257; --blue:#6aa3ff; --line:#3a2a2e; --off:#221719; --off-ink:#6f5e62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170e10; --surface:#22171a; --ink:#f5ecec; --muted:#b8a7aa;
  --red:#ff3348; --gold:#e3b257; --blue:#6aa3ff; --line:#3a2a2e; --off:#221719; --off-ink:#6f5e62; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}

header{background:linear-gradient(160deg,#ff2a3d,#c4001a 70%);color:#fff;border-radius:18px;padding:22px 18px 20px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(160,0,20,.25)}
header::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0 1.5px,transparent 2px) 0 0/22px 22px,
             radial-gradient(circle,rgba(255,255,255,.3) 0 1px,transparent 1.5px) 11px 9px/22px 22px;
  -webkit-mask:linear-gradient(90deg,transparent 30%,#000);mask:linear-gradient(90deg,transparent 30%,#000)}
h1{font-family:var(--f-display);font-weight:900;font-size:48px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;position:relative}
.sub{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;opacity:.92;position:relative}
.status{margin-top:14px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;font-size:14px;position:relative}
.status b{font-family:var(--f-display);font-size:24px;font-weight:900;vertical-align:-2px}

.cal{display:flex;flex-direction:column;gap:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.grid{row-gap:18px;padding-top:8px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.blank{aspect-ratio:3/4}

/* ---------- Paquets cadeaux ---------- */
.day{appearance:none;border:0;font:inherit;cursor:pointer;aspect-ratio:3/4;max-width:100%;border-radius:8px;
  position:relative;overflow:visible;font-variant-numeric:tabular-nums;transition:transform .15s;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.day:active{transform:scale(.94)}
.day:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.gift{
  --rw:5px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 35%,rgba(0,0,0,0) 80%,rgba(0,0,0,.22) 100%),
    linear-gradient(90deg,transparent calc(50% - var(--rw)),var(--rib-d) calc(50% - var(--rw)),var(--rib) calc(50% - 1px),var(--rib-d) calc(50% + var(--rw)),transparent calc(50% + var(--rw))),
    linear-gradient(180deg,transparent 30%,rgba(0,0,0,.28) 30% calc(30% + 2px),transparent calc(30% + 2px)),
    linear-gradient(180deg,transparent calc(30% - 7px),var(--rib) calc(30% - 7px) calc(30% - 1px),transparent calc(30% - 1px)),
    var(--deco,none),
    var(--base,linear-gradient(155deg,var(--c1),var(--c2)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.15),
    0 4px 0 var(--c3),0 7px 12px rgba(40,0,8,.28);
}
/* nœud */
.gift::before{content:"";position:absolute;left:50%;top:-9px;width:30px;height:18px;transform:translateX(-50%);
  background:
    radial-gradient(circle at 50% 70%,var(--rib-d) 0 3px,transparent 3.5px),
    radial-gradient(40% 46% at 27% 52%,var(--rib) 0 55%,var(--rib-d) 90%,transparent 100%),
    radial-gradient(40% 46% at 73% 52%,var(--rib) 0 55%,var(--rib-d) 90%,transparent 100%);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));z-index:2}

/* rouge : lun → ven, déco flocons */
.gift.week{--c1:#ff3b4e;--c2:#c2001a;--c3:#82000f;--rib:#ffd76a;--rib-d:#c8951f;
  --amt:linear-gradient(180deg,#fffbe6 0%,#ffe27a 35%,#e0a420 55%,#fff1a8 75%,#c8891a 100%);
  --deco:radial-gradient(circle,rgba(255,255,255,.55) 0 1.3px,transparent 1.8px) 3px 4px/14px 14px,
         radial-gradient(circle,rgba(255,255,255,.3) 0 1px,transparent 1.4px) 10px 11px/14px 14px}
/* doré métallique : samedi */
.gift.sat{--c3:#7a4e04;--rib:#e2001a;--rib-d:#9b0012;
  --base:linear-gradient(135deg,#fff7c4 0%,#ffd84a 18%,#c78a0e 38%,#fff0a0 52%,#e6b12c 66%,#a86f06 84%,#ffe27a 100%);
  --amt:linear-gradient(180deg,#ff4d5e 0%,#d0001a 45%,#8f0012 55%,#e2001a 100%);
  --deco:linear-gradient(120deg,transparent 14%,rgba(255,255,255,.75) 20%,transparent 27%,transparent 58%,rgba(255,255,255,.55) 62%,transparent 67%),
         radial-gradient(circle,#fff 0 1px,transparent 1.6px) 5px 6px/11px 11px}
/* bleu brillant : 26 → 31 */
.gift.goodies{--c1:#7cc0ff;--c2:#1749c4;--c3:#0b2a78;--rib:#f4f7ff;--rib-d:#a9b9d8;
  --amt:linear-gradient(180deg,#ffffff 0%,#e3eeff 40%,#9fb8e6 55%,#ffffff 100%);
  --deco:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.35) 30%,transparent 40%),
         radial-gradient(circle,rgba(255,255,255,.75) 0 1.2px,transparent 1.7px) 4px 5px/13px 13px}

/* numéro du jour : petite étiquette */
.day .n{font-family:var(--f-display);font-weight:900;font-size:clamp(11px,3.2vw,15px);line-height:1;color:#fff;
  position:absolute;left:5px;bottom:4px;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.gift.sat .n{text-shadow:0 1px 2px rgba(90,50,0,.8),0 0 3px rgba(90,50,0,.5)}
/* montant mis en avant, brillant */
.day .amt{font-family:var(--f-display);font-weight:900;font-size:clamp(17px,5.4vw,27px);line-height:1;white-space:nowrap;
  margin-top:22%;position:relative;z-index:1;
  background:var(--amt);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.45)) drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.gift.goodies .amt{font-size:clamp(12px,3.6vw,18px);letter-spacing:.02em}
.gift.sat .amt{filter:drop-shadow(0 1px 0 rgba(255,255,255,.7)) drop-shadow(0 2px 2px rgba(90,50,0,.45))}

/* case ouverte : le ruban est défait */
.gift.open{background:
    linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 35%,rgba(0,0,0,0) 80%,rgba(0,0,0,.22) 100%),
    linear-gradient(180deg,transparent 30%,rgba(0,0,0,.28) 30% calc(30% + 2px),transparent calc(30% + 2px)),
    var(--deco,none),
    var(--base,linear-gradient(155deg,var(--c1),var(--c2)))}
.gift.open::before{display:none}

.day.today{animation:bob 1.8s ease-in-out infinite}
.day.today{outline:3px solid var(--gold);outline-offset:3px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}

/* dimanches : grisés */
.day.none{background:var(--off);color:var(--off-ink);cursor:default;border-radius:8px;box-shadow:none;justify-content:center;padding-bottom:0;gap:2px}
.day.none .n{position:static;text-shadow:none;color:inherit;font-size:clamp(15px,4.4vw,21px)}
.day.none .t{font-size:10px;font-weight:700}

/* 25 décembre : sapin */
.day.tree{background:transparent;cursor:default;box-shadow:none;justify-content:center;padding:0}
.day.tree svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,40,10,.3))}

@media (prefers-reduced-motion:reduce){.day.today{animation:none}.day{transition:none}}

/* défi et gagnants dans le panneau */
.defi{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.defi .k,.winners .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.winners{margin-top:12px;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.winners .row{display:flex;justify-content:space-between;gap:10px}
.winners .row span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere;min-width:0;white-space:pre-wrap}
.gift .won{position:absolute;right:4px;bottom:3px;z-index:1;width:14px;height:14px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}

/* administration */
.adminbtn{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.adminbtn:focus-visible,.arow:focus-visible,.field input:focus-visible,.field textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.admin{display:flex;flex-direction:column;gap:10px}
.admin h2{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0;text-transform:uppercase}
.admin .hint{font-size:13px;color:var(--muted);margin:0}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.arow .sw{width:12px;height:28px;border-radius:3px;flex:none}
.arow .sw.week{background:linear-gradient(155deg,#ff3b4e,#c2001a)}
.arow .sw.sat{background:linear-gradient(135deg,#fff7c4,#ffd84a 30%,#c78a0e 60%,#ffe27a)}
.arow .sw.goodies{background:linear-gradient(155deg,#7cc0ff,#1749c4)}
.arow .lbl{flex:1;min-width:0}
.arow .lbl b{display:block}
.arow .lbl small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none}
.pill.ok{background:color-mix(in srgb,#1f8a3a 18%,transparent);color:#1f8a3a}
.pill.todo{background:var(--off);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:700}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.msg{font-size:13px;margin-top:8px;min-height:1em}
.msg.err{color:var(--red)}
.btns{display:flex;gap:8px}
.btns .close{margin-top:10px}
.close.alt{background:var(--off);color:var(--ink)}
.ghbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ghbox .btns .close{margin-top:0;padding:11px}
.ghbox .hint{margin-top:8px}
.legend{align-self:center;background:none;border:0;font:inherit;font-size:11px;color:var(--muted);opacity:.7;padding:8px;cursor:pointer;letter-spacing:.04em}
.legend:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.sim{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.sim .lab{font-size:13px;color:var(--muted);text-align:center;min-width:0}
.sim .lab b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);text-transform:uppercase}
.sim button{border:0;border-radius:10px;width:44px;height:44px;flex:none;font:inherit;font-size:20px;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.sim button:disabled{opacity:.35;cursor:default}
.sim button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* panneau détail */
.scrim{position:fixed;inset:0;background:rgba(20,8,10,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding-top:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .d{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;margin:6px 0 14px;text-transform:uppercase}
.prizes{display:flex;flex-direction:column;gap:8px}
.prize{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prize .who{font-weight:600}
.prize .amt{font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--red);white-space:nowrap}
.prize.s .amt{color:var(--gold)}
.prize.g .amt{color:var(--blue)}
.sheet p{color:var(--muted);margin:12px 0 0}
.close{margin-top:18px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.close:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.lockmsg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0}
.lockmsg svg{width:44px;height:44px;color:var(--red)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Challenge OUEST 1</h1>
    <div class="sub">Décembre 2026</div>
    <div class="status" id="status" hidden></div>
  </header>

  <div class="sim" id="sim" hidden>
    <button type="button" id="simPrev" aria-label="Jour précédent">‹</button>
    <div class="lab">Simulation<b id="simDay"></b></div>
    <button type="button" id="simNext" aria-label="Jour suivant">›</button>
  </div>

  <section class="cal" aria-label="Calendrier de décembre 2026">
    <div class="dow" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="admin" id="admin" hidden aria-labelledby="adminTitle">
    <h2 id="adminTitle">Administration</h2>
    <p class="hint">Touchez un jour pour écrire son challenge ou ses gagnants. Chaque enregistrement est publié sur le site et visible par tous d'ici 1 à 2 minutes.</p>
    <div class="ghbox">
      <div class="field"><label for="f-token">Clé GitHub</label>
        <input id="f-token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
      <div class="btns"><button type="button" class="close" id="tokSave">Mémoriser sur cet appareil</button><button type="button" class="close alt" id="tokForget">Oublier</button></div>
      <p class="hint" id="ghInfo"></p>
    </div>
    <p class="hint" id="adminNote"></p>
    <div class="alist" id="alist"></div>
    <button type="button" class="adminbtn" id="adminClose">Fermer l'administration</button>
  </section>
  <div class="foot" id="foot"></div>
  <button type="button" class="legend" id="legend">Challenge OUEST 1 · SFR · 2026</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

<script>
(function(){
  var DOWS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  function dowOf(d){return (2+(d-1))%7;} // 1er décembre 2026 = mardi ; 0 = dimanche
  function gain(d){
    var w=dowOf(d);
    if(d===25) return {type:"none",label:"Noël",why:"Pas de case le jour de Noël."};
    if(w===0) return {type:"none",label:"Dim.",why:"Pas de case le dimanche."};
    if(d>=26) return {type:"goodies",tag:"Goodies",prizes:[{who:"Gain du jour",amt:"Goodies",c:"g"}]};
    if(w===6) return {type:"sat",tag:"60 €",prizes:[{who:"Magasin",amt:"30 €",c:"s"},{who:"Vendeur",amt:"30 €",c:"s"}]};
    return {type:"week",tag:"20 €",prizes:[{who:"Magasin",amt:"20 €",c:""}]};
  }
  function parisToday(){
    var p=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var o={};p.forEach(function(x){o[x.type]=+x.value;});return o;
  }
  var preview=location.hash==="#apercu";
  var simM=/^#jour-(\d{1,2})$/.exec(location.hash), sim=simM?Math.min(31,Math.max(1,+simM[1])):0;
  var t=parisToday();
  var openUpTo, todayDay=0;
  if(sim){openUpTo=sim;todayDay=sim;}
  else if(preview) openUpTo=31;
  else if(t.year<2026||(t.year===2026&&t.month<12)) openUpTo=0;
  else if(t.year===2026&&t.month===12){openUpTo=t.day;todayDay=t.day;}
  else openUpTo=31;

  var st=document.getElementById("status");
  if(preview){st.innerHTML="<b>Aperçu</b> &nbsp;toutes les cases sont ouvertes";st.hidden=false;}
  else if(todayDay){
    var g0=gain(todayDay);
    st.innerHTML= g0.type==="none" ? "Aujourd'hui : pas de case. Rendez-vous demain !"
      : "Case du jour : <b>"+todayDay+"</b> &nbsp;à remporter : "+g0.prizes.map(function(p){return p.amt+" ("+p.who.toLowerCase()+")";}).join(" + ");
    st.hidden=false;
  }

  var TREE='<svg viewBox="0 0 60 80" aria-hidden="true">'+
    '<path d="M30 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L21 10l6-1z" fill="#ffd34d" stroke="#c8951f" stroke-width="1"/>'+
    '<path d="M30 16L44 34H37L50 52H41L55 68H5L19 52H10L23 34H16Z" fill="#1f8a3a"/>'+
    '<path d="M30 16L44 34H37L50 52H41L55 68H30Z" fill="#146b2b"/>'+
    '<path d="M18 40q12 5 25-1M14 58q16 6 33-1" stroke="#ffd34d" stroke-width="1.6" fill="none"/>'+
    '<rect x="26" y="68" width="8" height="8" rx="1" fill="#7a4a22"/>'+
    '<circle cx="26" cy="30" r="2.4" fill="#e2001a"/><circle cx="36" cy="44" r="2.4" fill="#4aa3ff"/>'+
    '<circle cx="22" cy="48" r="2.4" fill="#ffd34d"/><circle cx="40" cy="61" r="2.6" fill="#e2001a"/>'+
    '<circle cx="19" cy="63" r="2.4" fill="#4aa3ff"/><circle cx="31" cy="56" r="2.2" fill="#fff"/>'+
    '</svg>';
  var grid=document.getElementById("grid");
  var lead=(dowOf(1)+6)%7;
  for(var i=0;i<lead;i++){var b=document.createElement("div");b.className="blank";grid.appendChild(b);}
  for(var d=1;d<=31;d++){
    var g=gain(d), el=document.createElement("button");
    el.type="button";el.id="day-"+d;el.style.setProperty("--i",d);
    var isOpen=d<=openUpTo;
    if(d===25){
      el.className="day tree";
      el.innerHTML=TREE;
    } else if(g.type==="none"){
      el.className="day none";
      el.innerHTML='<span class="n">'+d+'</span><span class="t">'+g.label+'</span>';
    } else {
      el.className="day gift "+g.type+(isOpen?" open":"")+(d===todayDay?" today":"");
      el.innerHTML='<span class="n">'+d+'</span><span class="amt">'+g.tag+'</span>';
    }
    el.setAttribute("aria-label",DOWS[dowOf(d)]+" "+d+" décembre"+(g.type==="none"?", pas de case":(isOpen?", ouverte":", fermée")));
    if(g.type==="none") el.setAttribute("aria-disabled","true");
    if(d===25) el.setAttribute("aria-label","vendredi 25 décembre, Noël, pas de case");
    (function(day){el.addEventListener("click",function(){openSheet(day);});})(d);
    grid.appendChild(el);
  }

  var sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"), lastBtn=null;
  function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pad(d){return (d<10?"0":"")+d;}
  function info(d){return DATA["d"+pad(d)]||{};}
  function hasWinner(d){var x=info(d);return !!((x.magasin||"").trim()||(x.vendeur||"").trim()||(x.gagnants||"").trim());}
  function showSheet(html,focusId){
    sheet.innerHTML=html; sheet.hidden=false; scrim.hidden=false;
    var c=document.getElementById(focusId||"closeBtn"); if(c) c.focus();
    var cb=document.getElementById("closeBtn"); if(cb) cb.addEventListener("click",closeSheet);
  }
  function openSheet(d){
    var g=gain(d); if(g.type==="none")return;
    lastBtn=document.getElementById("day-"+d);
    var head='<div class="d">'+DOWS[dowOf(d)]+' '+d+' décembre 2026</div>';
    var body, x=info(d);
    if(d>openUpTo){
      body='<div class="big" id="sheetTitle">Case '+d+'</div><div class="lockmsg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><strong>Pas encore !</strong><span style="color:var(--muted)">Ce cadeau s\'ouvre le '+d+' décembre.</span></div>';
    } else {
      body='<div class="big" id="sheetTitle">'+(g.type==="goodies"?"Goodies à gagner":"Gain du jour")+'</div>'+
        ((x.challenge||"").trim()?'<div class="defi"><span class="k">Challenge du jour</span>'+esc(x.challenge)+'</div>':'')+
        '<div class="prizes">'+
        g.prizes.map(function(p){return '<div class="prize '+p.c+'"><span class="who">'+p.who+'</span><span class="amt">'+p.amt+'</span></div>';}).join("")+'</div>';
      if(hasWinner(d)){
        var rows=[];
        if(g.type==="goodies"){ if((x.gagnants||"").trim()) rows.push(["Gagnants",x.gagnants]); }
        else {
          if((x.magasin||"").trim()) rows.push(["Magasin",x.magasin]);
          if(g.type==="sat"&&(x.vendeur||"").trim()) rows.push(["Vendeur",x.vendeur]);
        }
        body+='<div class="winners"><span class="k">Gagnants</span>'+rows.map(function(r){return '<div class="row"><span>'+r[0]+'</span><span>'+esc(r[1])+'</span></div>';}).join("")+'</div>';
      }
    }
    showSheet(head+body+'<button class="close" id="closeBtn" type="button">Fermer</button>');
  }
  function closeSheet(){sheet.hidden=true;scrim.hidden=true;if(lastBtn&&document.contains(lastBtn))lastBtn.focus();}
  scrim.addEventListener("click",closeSheet);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet();});
  window.addEventListener("hashchange",function(){location.reload();});

  /* ---------- Données : fichier data.json du site ---------- */
  /* Si le site est sur un nom de domaine personnalisé, remplissez owner et repo à la main. */
  var GITHUB={owner:"",repo:"",branch:"main",path:"data.json"};
  (function(){
    var h=location.hostname;
    if(!GITHUB.owner&&/\.github\.io$/.test(h)){
      GITHUB.owner=h.split(".")[0];
      var seg=location.pathname.split("/")[1]||"";
      GITHUB.repo= seg&&seg.indexOf(".")<0 ? seg : h;
    }
  })();
  var CODE_HASH="83813ecc74118d3d24f547d4849dbb99b6449bd3074988d639270f6856ed23ab";
  var DATA={}, TOKEN="";
  try{TOKEN=localStorage.getItem("ouest1_token")||"";}catch(e){}

  var STAR='<svg class="won" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#fff"/></svg>';
  function markWinners(){
    for(var d=1;d<=31;d++){
      var el=document.getElementById("day-"+d); if(!el||el.className.indexOf("gift")<0) continue;
      var old=el.querySelector(".won"); if(old) old.remove();
      if(d<=openUpTo&&hasWinner(d)){ el.insertAdjacentHTML("beforeend",STAR); }
    }
  }
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{};})
    .then(function(j){DATA=(j&&j.jours)||{};markWinners();renderAdmin();}).catch(function(){});

  function giftDays(){var r=[];for(var d=1;d<=31;d++){if(gain(d).type!=="none")r.push(d);}return r;}
  var TYPE_NAME={week:"20 € magasin",sat:"30 € magasin + 30 € vendeur",goodies:"Goodies"};
  function renderAdmin(){
    var list=document.getElementById("alist"); if(document.getElementById("admin").hidden) return;
    list.innerHTML=giftDays().map(function(d){
      var g=gain(d), x=info(d), hasC=!!(x.challenge||"").trim(), hasW=hasWinner(d);
      return '<button type="button" class="arow" data-d="'+d+'"><span class="sw '+g.type+'"></span>'+
        '<span class="lbl"><b>'+DOWS[dowOf(d)]+' '+d+' déc.</b><small>'+(hasC?esc(x.challenge):TYPE_NAME[g.type])+'</small></span>'+
        '<span class="pill '+(hasC?"ok":"todo")+'">'+(hasC?"Challenge ✓":"Challenge")+'</span>'+
        '<span class="pill '+(hasW?"ok":"todo")+'">'+(hasW?"Gagnant ✓":"Gagnant")+'</span></button>';
    }).join("");
    var gi=document.getElementById("ghInfo");
    gi.textContent=(GITHUB.owner&&GITHUB.repo?"Dépôt : "+GITHUB.owner+"/"+GITHUB.repo+". ":"Dépôt GitHub non détecté : ouvrez le site depuis son adresse github.io. ")+
      (TOKEN?"Clé mémorisée sur cet appareil.":"Aucune clé mémorisée : collez votre clé GitHub pour pouvoir publier.");
  }
  document.getElementById("alist").addEventListener("click",function(e){
    var b=e.target.closest(".arow"); if(b) openEditor(+b.getAttribute("data-d"),b);
  });

  /* Publication sur GitHub */
  function b64(str){return btoa(unescape(encodeURIComponent(str)));}
  function ghUrl(){return "https://api.github.com/repos/"+GITHUB.owner+"/"+GITHUB.repo+"/contents/"+GITHUB.path;}
  function ghHeaders(){return {"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json"};}
  function publish(label){
    if(!TOKEN) return Promise.reject({msg:"Ajoutez d'abord votre clé GitHub dans le cadre « Clé GitHub »."});
    if(!GITHUB.owner||!GITHUB.repo) return Promise.reject({msg:"Dépôt GitHub introuvable. Ouvrez le site depuis son adresse github.io."});
    var body=JSON.stringify({jours:DATA},null,2);
    function attempt(retry){
      return fetch(ghUrl()+"?ref="+GITHUB.branch+"&t="+Date.now(),{headers:ghHeaders(),cache:"no-store"}).then(function(r){
        if(r.status===401||r.status===403) throw {msg:"La clé GitHub est refusée. Vérifiez qu'elle n'a pas expiré et qu'elle a le droit « Contents : Read and write » sur ce dépôt."};
        if(r.status===404) return null;
        if(!r.ok) throw {msg:"GitHub ne répond pas correctement ("+r.status+"). Réessayez dans un instant."};
        return r.json();
      }).then(function(cur){
        var payload={message:label,content:b64(body),branch:GITHUB.branch};
        if(cur&&cur.sha) payload.sha=cur.sha;
        return fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(payload)});
      }).then(function(r){
        if(r.status===409&&retry) return attempt(false);
        if(r.status===401||r.status===403) throw {msg:"La clé GitHub est refusée. Vérifiez qu'elle a le droit « Contents : Read and write » sur ce dépôt."};
        if(r.status===404) throw {msg:"Dépôt introuvable avec cette clé. Vérifiez que la clé donne accès au dépôt "+GITHUB.owner+"/"+GITHUB.repo+"."};
        if(!r.ok) throw {msg:"La publication a échoué ("+r.status+"). Réessayez dans un instant."};
      });
    }
    return attempt(true);
  }

  function openEditor(d,from){
    var g=gain(d), x=info(d); lastBtn=from;
    var f='<div class="d">'+DOWS[dowOf(d)]+' '+d+' décembre 2026 · '+TYPE_NAME[g.type]+'</div>'+
      '<div class="big" id="sheetTitle">Modifier le jour '+d+'</div>'+
      '<form id="edForm"><div class="field"><label for="f-challenge">Challenge du jour</label><textarea id="f-challenge" placeholder="Ex. : 3 forfaits 5G vendus dans la journée">'+esc(x.challenge)+'</textarea></div>';
    if(g.type==="goodies"){
      f+='<div class="field"><label for="f-gagnants">Gagnants</label><textarea id="f-gagnants" placeholder="Un gagnant par ligne">'+esc(x.gagnants)+'</textarea></div>';
    } else {
      f+='<div class="field"><label for="f-magasin">Magasin gagnant</label><input id="f-magasin" type="text" value="'+esc(x.magasin)+'" placeholder="Nom du magasin"></div>';
      if(g.type==="sat") f+='<div class="field"><label for="f-vendeur">Vendeur gagnant</label><input id="f-vendeur" type="text" value="'+esc(x.vendeur)+'" placeholder="Prénom et nom"></div>';
    }
    f+='<div class="msg" id="edMsg" role="status"></div><div class="btns"><button type="button" class="close alt" id="closeBtn">Annuler</button><button type="submit" class="close" id="saveBtn">Enregistrer</button></div></form>';
    showSheet(f,"f-challenge");
    document.getElementById("edForm").addEventListener("submit",function(e){
      e.preventDefault();
      var val=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
      var key="d"+pad(d), before=DATA[key];
      DATA[key]={challenge:val("f-challenge"),magasin:val("f-magasin"),vendeur:val("f-vendeur"),gagnants:val("f-gagnants")};
      var msg=document.getElementById("edMsg"), btn=document.getElementById("saveBtn");
      btn.disabled=true; msg.className="msg"; msg.textContent="Publication sur le site…";
      publish("Jour "+d+" mis à jour").then(function(){
        renderAdmin(); markWinners();
        document.getElementById("adminNote").textContent="Jour "+d+" publié. Le site sera à jour d'ici 1 à 2 minutes.";
        closeSheet();
      }).catch(function(err){
        if(before===undefined) delete DATA[key]; else DATA[key]=before;
        btn.disabled=false; msg.className="msg err";
        msg.textContent=(err&&err.msg)||"La publication a échoué. Vérifiez votre connexion et réessayez.";
      });
    });
  }

  /* Accès admin par code */
  function sha256(str){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2);}).join("");
    });
  }
  function openAdmin(){
    var a=document.getElementById("admin"); a.hidden=false;
    try{sessionStorage.setItem("ouest1_admin","1");}catch(e){}
    document.getElementById("f-token").value=TOKEN;
    renderAdmin(); a.scrollIntoView({behavior:"smooth",block:"start"});
  }
  document.getElementById("legend").addEventListener("click",function(){
    if(!document.getElementById("admin").hidden) return;
    lastBtn=this;
    showSheet('<div class="big" id="sheetTitle">Code d\'accès</div><form id="codeForm"><div class="field"><label for="f-code">Code</label>'+
      '<input id="f-code" type="password" inputmode="numeric" autocomplete="off"></div><div class="msg err" id="codeMsg" role="status"></div>'+
      '<div class="btns"><button type="button" class="close alt" id="closeBtn">Annuler</button><button type="submit" class="close">Valider</button></div></form>',"f-code");
    document.getElementById("codeForm").addEventListener("submit",function(e){
      e.preventDefault();
      sha256(document.getElementById("f-code").value.trim()).then(function(h){
        if(h===CODE_HASH){closeSheet();openAdmin();}
        else document.getElementById("codeMsg").textContent="Code incorrect.";
      }).catch(function(){document.getElementById("codeMsg").textContent="Ouvrez le site en https pour accéder à l'administration.";});
    });
  });
  document.getElementById("adminClose").addEventListener("click",function(){
    document.getElementById("admin").hidden=true;
    try{sessionStorage.removeItem("ouest1_admin");}catch(e){}
    window.scrollTo({top:0,behavior:"smooth"});
  });
  document.getElementById("tokSave").addEventListener("click",function(){
    TOKEN=document.getElementById("f-token").value.trim();
    try{localStorage.setItem("ouest1_token",TOKEN);}catch(e){}
    renderAdmin();
  });
  document.getElementById("tokForget").addEventListener("click",function(){
    TOKEN=""; document.getElementById("f-token").value="";
    try{localStorage.removeItem("ouest1_token");}catch(e){}
    renderAdmin();
  });
  try{ if(sessionStorage.getItem("ouest1_admin")==="1") openAdmin(); }catch(e){}

  var foot=document.getElementById("foot");
  if(sim) foot.textContent="Mode simulation actif. Retirez #jour-"+sim+" de l'adresse pour revenir au mode normal.";
  else if(preview) foot.textContent="Mode aperçu actif. Retirez #apercu de l'adresse pour revenir au mode normal.";
  else foot.hidden=true;
})();
</script>
</body>
</html>
